spring:
  jpa:
    hibernate:
      # Flyway owns the schema — `update` would let Hibernate silently patch it
      # and mask broken migrations. `validate` fails fast on divergence instead.
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true

logging:
  level:
    com.firstpage: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
