server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: firstpage-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/firstpage}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      idle-timeout: 300000
      max-lifetime: 600000
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

# Firebase configuration
firebase:
  service-account-path: ${FIREBASE_SERVICE_ACCOUNT_PATH:service-account.json}

# Cloudinary configuration
cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:}
  api-key: ${CLOUDINARY_API_KEY:}
  api-secret: ${CLOUDINARY_API_SECRET:}

# Application custom properties
app:
  # Where the SPA is served from. /s/{slug} bounces real visitors here after a
  # crawler has read the link-preview tags, so a wrong value breaks every
  # shared link.
  frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:3001}
  ai:
    default-provider: ${AI_DEFAULT_PROVIDER:gemini}
    gemini-api-key: ${GEMINI_API_KEY:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001,http://localhost:5173}
  media:
    max-image-size: ${MAX_IMAGE_SIZE:10485760}
    max-video-size: ${MAX_VIDEO_SIZE:52428800}

# SpringDoc OpenAPI
springdoc:
  api-docs:
    path: /api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    tags-sorter: alpha
    operations-sorter: method

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

# Logging
logging:
  level:
    root: INFO
    com.firstpage: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: WARN
    org.flywaydb: INFO
